<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班級星星撲滿 Star Piggy Bank</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #d6effa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    /* Main White Card */
    .piggy-card {
      position: relative;
      background: #ffffff;
      border-radius: 36px;
      width: 100%;
      max-width: 720px;
      padding: 28px 24px 20px;
      box-shadow: 0 12px 30px rgba(85, 130, 160, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .status-badge {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: #eef8fc;
      color: #3a8bb3;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .status-dot.connected {
      background: #10b981;
    }

    .pig-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pig-svg {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pig-svg.bounce {
      transform: scale(1.06);
    }

    /* Score Overlay inside Piggy Belly */
    .score-box {
      position: absolute;
      top: 52%;
      left: 52%;
      transform: translate(-50%, -50%);
      background: rgba(255, 250, 240, 0.94);
      border: 3px solid #f7d6df;
      border-radius: 26px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 16px rgba(226, 125, 152, 0.15);
    }

    .score-number {
      background: #a5e2fa;
      color: #0f172a;
      font-size: 46px;
      font-weight: 900;
      min-width: 92px;
      height: 82px;
      padding: 0 16px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .star-icon {
      font-size: 46px;
      filter: drop-shadow(0 3px 5px rgba(245, 158, 11, 0.35));
    }

    /* Floating Stars Container */
    .floating-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 36px;
    }

    .floating-star {
      position: absolute;
      left: 50%;
      top: 45%;
      font-size: 28px;
      font-weight: 800;
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, 0) scale(0.8);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -110px) scale(1.35);
      }
    }

    /* Plus / Minus Controls Row */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
    }

    .action-pill {
      background: #ffffff;
      border-radius: 999px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 20px rgba(85, 130, 160, 0.12);
    }

    .star-input {
      background: #a5e2fa;
      border: none;
      outline: none;
      border-radius: 999px;
      width: 112px;
      height: 76px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      transition: box-shadow 0.2s;
    }

    .star-input::placeholder {
      color: #0f172a;
      opacity: 0.85;
      font-size: 16px;
    }

    .star-input:focus {
      box-shadow: 0 0 0 3px #38bdf8;
    }

    /* Hide default number arrows */
    .star-input::-webkit-outer-spin-button,
    .star-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .action-btn:hover {
      transform: scale(1.07);
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    .btn-plus {
      background: linear-gradient(145deg, #10b981, #059669);
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.35);
    }

    .btn-minus {
      background: linear-gradient(145deg, #ef4444, #dc2626);
      box-shadow: 0 6px 14px rgba(239, 68, 68, 0.35);
    }

    /* Bottom Grade Buttons */
    .grades-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      max-width: 960px;
    }

    .grade-btn {
      background: #ffffff;
      color: #6366f1;
      border: 3px solid transparent;
      border-radius: 999px;
      padding: 14px 30px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(85, 130, 160, 0.1);
      transition: all 0.2s ease;
    }

    .grade-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
    }

    .grade-btn.active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body>

  <!-- Piggy Bank Display Card -->
  <div class="piggy-card">
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">連線中...</span>
    </div>

    <div class="floating-container" id="floatingContainer"></div>

    <div class="pig-wrapper">
      <!-- Cute Vector Piggy Bank -->
      <svg id="pigSvg" class="pig-svg" viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pigBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffd6e0" />
            <stop offset="100%" stop-color="#ffb3c6" />
          </linearGradient>
          <linearGradient id="pigEarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffadc2" />
            <stop offset="100%" stop-color="#ff8fab" />
          </linearGradient>
        </defs>

        <!-- Curly Tail -->
        <path d="M 426 175 C 455 165, 462 135, 444 132 C 428 129, 426 155, 450 160 C 472 164, 485 145, 482 128"
              fill="none" stroke="#ff8fab" stroke-width="8" stroke-linecap="round" />

        <!-- Back Legs -->
        <rect x="175" y="290" width="44" height="54" rx="20" fill="#ff9eb5" stroke="#e57391" stroke-width="4" />
        <rect x="330" y="290" width="44" height="54" rx="20" fill="#ff9eb5" stroke="#e57391" stroke-width="4" />

        <!-- Back Ear -->
        <path d="M 165 92 C 155 42, 195 35, 212 78 Z" fill="url(#pigEarGrad)" stroke="#e57391" stroke-width="4" stroke-linejoin="round" />

        <!-- Main Pig Body -->
        <ellipse cx="265" cy="195" rx="168" ry="125" fill="url(#pigBodyGrad)" stroke="#e57391" stroke-width="5" />

        <!-- Coin Slot -->
        <rect x="235" y="82" width="76" height="14" rx="7" fill="#5c2b38" />
        <rect x="239" y="84" width="68" height="4" rx="2" fill="#8a4456" />

        <!-- Front Legs -->
        <rect x="145" y="298" width="46" height="56" rx="22" fill="#ffb3c6" stroke="#e57391" stroke-width="4.5" />
        <rect x="302" y="298" width="46" height="56" rx="22" fill="#ffb3c6" stroke="#e57391" stroke-width="4.5" />

        <!-- Snout -->
        <ellipse cx="95" cy="195" rx="26" ry="38" fill="#ff9eb5" stroke="#e57391" stroke-width="5" />
        <ellipse cx="89" cy="186" rx="5" ry="9" fill="#b84a66" />
        <ellipse cx="89" cy="204" rx="5" ry="9" fill="#b84a66" />

        <!-- Front Ear -->
        <path d="M 185 104 C 178 46, 224 44, 236 96 Z" fill="#ffb3c6" stroke="#e57391" stroke-width="4.5" stroke-linejoin="round" />
        <path d="M 193 96 C 189 62, 215 61, 223 91 Z" fill="#ff8fab" />

        <!-- Eye -->
        <circle cx="144" cy="160" r="12" fill="#2b1b20" />
        <circle cx="140" cy="156" r="4" fill="#ffffff" />

        <!-- Rosy Cheek -->
        <ellipse cx="146" cy="192" rx="16" ry="10" fill="#ff7597" opacity="0.55" />
      </svg>

      <!-- Current Stars Badge -->
      <div class="score-box">
        <div class="score-number" id="scoreDisplay">0</div>
        <div class="star-icon">⭐</div>
      </div>
    </div>
  </div>

  <!-- Plus and Minus Input Controls -->
  <div class="controls-row">
    <!-- Add Stars -->
    <div class="action-pill">
      <input type="number" id="addInput" class="star-input" placeholder="type here" min="1" />
      <button class="action-btn btn-plus" id="addBtn" title="Add Stars">+</button>
    </div>

    <!-- Subtract Stars -->
    <div class="action-pill">
      <input type="number" id="subInput" class="star-input" placeholder="type here" min="1" />
      <button class="action-btn btn-minus" id="subBtn" title="Subtract Stars">−</button>
    </div>
  </div>

  <!-- Six Grade Selector Buttons -->
  <div class="grades-row" id="gradesRow">
    <button class="grade-btn active" data-grade="grade1">一年級</button>
    <button class="grade-btn" data-grade="grade2">二年級</button>
    <button class="grade-btn" data-grade="grade3">三年級</button>
    <button class="grade-btn" data-grade="grade4">四年級</button>
    <button class="grade-btn" data-grade="grade5">五年級</button>
    <button class="grade-btn" data-grade="grade6">六年級</button>
  </div>

  <!-- Firebase Realtime Database Sync Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDWvG6bcr4Oi9iZdBPnoF6VU7Je1jMXu9c",
      authDomain: "piggystars.firebaseapp.com",
      databaseURL: "https://piggystars-default-rtdb.firebaseio.com",
      projectId: "piggystars",
      storageBucket: "piggystars.firebasestorage.app",
      messagingSenderId: "7757319262",
      appId: "1:7757319262:web:5e4367a9398385f349b8cf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentGrade = "grade1";
    let gradeScores = {
      grade1: 0,
      grade2: 0,
      grade3: 0,
      grade4: 0,
      grade5: 0,
      grade6: 0
    };

    const scoreDisplay = document.getElementById("scoreDisplay");
    const addInput = document.getElementById("addInput");
    const subInput = document.getElementById("subInput");
    const addBtn = document.getElementById("addBtn");
    const subBtn = document.getElementById("subBtn");
    const pigSvg = document.getElementById("pigSvg");
    const floatingContainer = document.getElementById("floatingContainer");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const gradeButtons = document.querySelectorAll(".grade-btn");

    // Sound Effects (Web Audio API)
    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === "add") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16); // G5
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(160, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
          osc.start();
          osc.stop(ctx.currentTime + 0.28);
        }
      } catch (e) {
        // Ignore if audio blocked
      }
    }

    function showFloatingText(text, color) {
      const el = document.createElement("div");
      el.className = "floating-star";
      el.textContent = text;
      el.style.color = color;
      floatingContainer.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function triggerPigBounce() {
      pigSvg.classList.remove("bounce");
      void pigSvg.offsetWidth;
      pigSvg.classList.add("bounce");
      setTimeout(() => pigSvg.classList.remove("bounce"), 260);
    }

    function updateDisplay() {
      scoreDisplay.textContent = gradeScores[currentGrade] ?? 0;
    }

    // Listen to real-time updates from Firebase
    const starsRef = ref(db, "classStars");
    onValue(starsRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        gradeScores = { ...gradeScores, ...data };
      }
      updateDisplay();
      statusDot.classList.add("connected");
      statusText.textContent = "雲端同步中";
    }, (error) => {
      statusDot.classList.remove("connected");
      statusText.textContent = "連線失敗";
      console.error(error);
    });

    // Update stars in Firebase safely using transactions
    function changeStars(delta) {
      if (!delta || isNaN(delta) || delta === 0) return;

      const gradeRef = ref(db, `classStars/${currentGrade}`);
      runTransaction(gradeRef, (currentVal) => {
        const base = typeof currentVal === "number" ? currentVal : 0;
        return Math.max(0, base + delta);
      });

      triggerPigBounce();
      if (delta > 0) {
        playSound("add");
        showFloatingText(`+${delta} ⭐`, "#10b981");
      } else {
        playSound("sub");
        showFloatingText(`${delta} ⭐`, "#ef4444");
      }
    }

    // Button Click Listeners
    addBtn.addEventListener("click", () => {
      const val = parseInt(addInput.value, 10);
      if (val > 0) {
        changeStars(val);
        addInput.value = "";
      }
    });

    subBtn.addEventListener("click", () => {
      const val = parseInt(subInput.value, 10);
      if (val > 0) {
        changeStars(-val);
        subInput.value = "";
      }
    });

    // Allow pressing Enter inside either input box
    addInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addBtn.click();
    });
    subInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") subBtn.click();
    });

    // Grade Switching Buttons
    gradeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        gradeButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentGrade = btn.dataset.grade;
        updateDisplay();
      });
    });
  </script>
</body>
</html>
